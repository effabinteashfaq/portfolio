</g>
</g>

<!-- lamp post -->
<path d="M404 290 V214 Q404 206 396 206" stroke="#4A4A48" stroke-width="2.5" fill="none"/>
<rect x="388" y="204" width="10" height="5" rx="2" fill="#4A4A48"/>
