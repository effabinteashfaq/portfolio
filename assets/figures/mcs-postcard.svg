<rect x="140" y="142" width="7" height="68"/><rect x="156" y="142" width="7" height="68"/><rect x="172" y="142" width="7" height="68"/><rect x="188" y="142" width="7" height="68"/><rect x="204" y="142" width="7" height="68"/><rect x="220" y="142" width="7" height="68"/>
