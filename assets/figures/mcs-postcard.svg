<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Postcard illustration of the Military College of Signals: a domed brick building under an overcast golden sky, with the yellow MCS gate, palm trees and cypresses in front">
<defs>
<linearGradient id="mcsky" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#6E82A0"/><stop offset="0.55" stop-color="#B9B4B4"/><stop offset="1" stop-color="#F0C77E"/></linearGradient>
<clipPath id="mcclip"><rect x="0" y="0" width="420" height="300" rx="4"/></clipPath>
</defs>
<g clip-path="url(#mcclip)">
<!-- sky -->
<rect width="420" height="300" fill="url(#mcsky)"/>
<ellipse cx="360" cy="200" rx="120" ry="60" fill="#FAD58C" opacity="0.6"/>
